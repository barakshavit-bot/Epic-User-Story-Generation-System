<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Epic Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --navy:#1A1146;
    --navy-light:#2A1F5C;
    --yellow:#F5C400;
    --paper:#F7F5FB;
    --panel:#FFFFFF;
    --ink:#211A38;
    --slate:#6E668A;
    --line:#E4DEF2;
    --given:#3F8F5C;
    --when:#B8790A;
    --then:#4A3F91;
    --and:#8A8398;
    --danger:#B23B3B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:22px 28px 20px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    border-bottom:4px solid var(--yellow);
  }
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand .mark{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:.12em;
    color:var(--yellow);
    background:rgba(245,196,0,0.12);
    border:1px solid rgba(245,196,0,0.4);
    padding:3px 8px;
    border-radius:4px;
  }
  header h1{
    font-size:22px;
    font-weight:800;
    margin:0;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:13px;
    color:#C7BFE8;
    font-family:'JetBrains Mono',monospace;
  }
  .modes{
    display:flex;
    gap:6px;
    background:var(--navy-light);
    padding:6px;
    border-radius:8px;
  }
  .modes button{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
    padding:9px 14px;
    border-radius:6px;
    border:none;
    background:transparent;
    color:#C7BFE8;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .modes button.active{
    background:var(--yellow);
    color:var(--navy);
  }
  .modes button:hover:not(.active){
    background:rgba(255,255,255,0.08);
    color:#fff;
  }
  .nav-stack{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  main{flex:1;min-height:0;}
  main.generate-layout{
    display:grid;
    grid-template-columns:380px 1fr;
    align-items:stretch;
  }
  main.mock-layout{
    display:block;
    overflow-y:auto;
    height:calc(100vh - 96px);
  }
  @media (max-width:900px){
    main.generate-layout{grid-template-columns:1fr;}
  }
  .mock-page{
    max-width:760px;
    margin:0 auto;
    padding:40px 28px 70px;
  }
  .mock-page h2{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    color:var(--navy);
    margin:0 0 8px;
  }
  .mock-page .mock-page-sub{
    font-size:14px;
    color:var(--slate);
    line-height:1.55;
    margin:0 0 22px;
    max-width:560px;
  }
  .mock-summary-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    background:#F3F0FA;
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 13px;
    font-size:13px;
    color:var(--ink);
  }
  .mock-summary-box button{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    border:1.5px solid var(--navy-light);
    background:#fff;
    color:var(--navy-light);
    padding:6px 11px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .mock-summary-box button:hover{background:var(--navy-light);color:#fff;}
  .provider-toggle{
    display:flex;
    gap:4px;
    background:#F0ECFB;
    padding:4px;
    border-radius:8px;
    width:fit-content;
  }
  .provider-toggle button{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:600;
    padding:7px 14px;
    border-radius:6px;
    border:none;
    background:transparent;
    color:var(--slate);
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .provider-toggle button.active{
    background:var(--yellow);
    color:var(--navy);
  }
  .provider-toggle button:hover:not(.active){
    background:rgba(255,255,255,0.6);
    color:var(--navy);
  }

  .jira-modal-overlay{
    position:fixed;inset:0;
    background:rgba(26,17,70,0.55);
    display:flex;align-items:center;justify-content:center;
    z-index:1500;
    padding:20px;
  }
  .jira-modal{
    background:var(--panel);
    border-radius:14px;
    width:100%;
    max-width:520px;
    max-height:85vh;
    overflow-y:auto;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
  }
  .jira-modal h3{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    color:var(--navy);
    margin:0 0 6px;
  }
  .jira-modal .jira-modal-sub{
    font-size:13px;
    color:var(--slate);
    margin:0 0 20px;
    line-height:1.5;
  }
  .jira-modal .field{margin-bottom:18px;}
  .jira-field-label{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;color:var(--slate);
    display:block;margin-bottom:6px;
  }
  .jira-modal input[type=text]{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .jira-modal input[type=text]:focus{outline:none;border-color:var(--navy-light);}
  .jira-results{
    margin-top:8px;
    max-height:180px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:8px;
  }
  .jira-result{
    padding:9px 12px;
    font-size:13px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .jira-result:last-child{border-bottom:none;}
  .jira-result:hover{background:#F3F0FA;}
  .jira-selected-chip{
    display:inline-flex;align-items:center;gap:8px;
    background:#EEF9F0;border:1px solid rgba(63,143,92,0.35);
    color:var(--given);
    padding:8px 12px;border-radius:8px;
    font-size:13.5px;font-weight:600;
    margin-top:8px;
  }
  .jira-selected-chip button{
    border:none;background:none;color:inherit;cursor:pointer;
    opacity:0.7;font-size:14px;padding:0;
  }
  .jira-item-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .jira-item-picker button{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;
    border:1.5px solid var(--line);background:#fff;color:var(--navy);
    padding:6px 11px;border-radius:6px;cursor:pointer;
  }
  .jira-item-picker button.active{background:var(--yellow);border-color:var(--yellow);color:var(--navy);}
  .jira-modal-actions{display:flex;gap:8px;margin-top:22px;}
  .jira-modal-actions button{
    font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
    padding:11px 18px;border-radius:8px;cursor:pointer;border:none;
  }
  .jira-modal-actions .primary{background:var(--yellow);color:var(--navy);}
  .jira-modal-actions .primary:disabled{background:var(--line);color:var(--slate);cursor:not-allowed;}
  .jira-modal-actions .secondary{background:#fff;border:1.5px solid var(--line);color:var(--navy);}
  .jira-mode-toggle{display:flex;gap:4px;background:#F0ECFB;padding:4px;border-radius:8px;width:fit-content;margin-bottom:16px;}
  .jira-mode-toggle button{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;
    padding:7px 13px;border-radius:6px;border:none;background:transparent;color:var(--slate);cursor:pointer;
  }
  .jira-mode-toggle button.active{background:var(--yellow);color:var(--navy);}
  .jira-confirm-summary{
    background:#F3F0FA;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.7;
  }
  .jira-confirm-summary > div{margin-bottom:4px;}
  .jira-confirm-summary > div:last-child{margin-bottom:0;}

  .feedback-box{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:18px 20px;
    margin-top:28px;
    background:#FDFCFF;
  }
  .feedback-box > label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:10px;
  }
  .feedback-rating{display:flex;gap:8px;margin-bottom:10px;}
  .feedback-rating button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:7px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .feedback-rating button.active[data-rating="up"]{background:#EEF9F0;border-color:var(--given);color:var(--given);}
  .feedback-rating button.active[data-rating="down"]{background:#FDECEC;border-color:var(--danger);color:var(--danger);}
  .feedback-box textarea{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:10px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    resize:vertical;
    margin-bottom:10px;
  }
  .feedback-box textarea:focus{outline:none;border-color:var(--navy-light);}
  .feedback-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .feedback-actions button{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    padding:8px 13px;
    border-radius:6px;
    cursor:pointer;
  }
  #saveFeedbackBtn{border:1.5px solid var(--line);background:#fff;color:var(--navy);}
  #saveFeedbackBtn:hover{border-color:var(--navy-light);}
  #regenerateBtn{border:none;background:var(--yellow);color:var(--navy);}
  #regenerateBtn:hover{box-shadow:0 3px 10px rgba(245,196,0,0.4);}

  .feedback-entry{
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:10px;
    background:#FDFCFF;
  }
  .feedback-entry-head{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--slate);
  }
  .feedback-tag{font-size:14px;}
  .feedback-mode{
    background:#F0ECFB;
    color:var(--navy-light);
    padding:2px 7px;
    border-radius:5px;
    font-weight:600;
  }
  .feedback-date{margin-left:auto;}
  .feedback-remove{
    border:none;background:none;color:var(--slate);cursor:pointer;font-size:14px;
    opacity:0.6;padding:0 2px;
  }
  .feedback-remove:hover{opacity:1;color:var(--danger);}
  .feedback-entry p{margin:8px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink);}
  .feedback-entry .snippet{
    margin:4px 0 0;font-size:12px;color:var(--slate);font-style:italic;
  }

  .history-entry{
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:12px;
    background:#FDFCFF;
  }
  .history-entry-head{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--slate);
    margin-bottom:6px;
  }
  .history-mode{
    background:#F0ECFB;
    color:var(--navy-light);
    padding:2px 7px;
    border-radius:5px;
    font-weight:600;
  }
  .history-badge{
    background:#FFF6DE;
    color:#8A5E06;
    padding:2px 7px;
    border-radius:5px;
    font-weight:600;
    margin-left:auto;
  }
  .history-badge.archived{background:#EEF9F0;color:var(--given);}
  .history-title{
    font-size:14px;
    color:var(--ink);
    margin:0 0 10px;
    line-height:1.45;
  }
  .history-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .history-actions button{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    padding:6px 10px;
    border-radius:6px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--navy);
    cursor:pointer;
  }
  .history-actions button:hover{border-color:var(--navy-light);}
  .history-delete-btn{color:var(--danger) !important;}
  .history-detail{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .history-detail .doc{font-size:14px;}
  .input-panel{
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:26px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .field label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:8px;
  }
  .field textarea, .field input[type=text]{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:12px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    resize:vertical;
    background:#FDFCFF;
  }
  .field textarea:focus, .field input:focus{
    outline:none;
    border-color:var(--navy-light);
  }
  .hint{
    font-size:12px;
    color:var(--slate);
    margin-top:6px;
    line-height:1.4;
  }
  .word-upload-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .word-upload-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--navy-light);
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .word-upload-btn:hover{border-color:var(--navy-light);background:#F3F0FA;}
  .word-upload-status{font-size:11.5px;color:var(--slate);}
  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:30px 18px;
    text-align:center;
    cursor:pointer;
    background:linear-gradient(180deg, #FDFCFF 0%, #F5F2FC 100%);
    transition:border-color .18s, background .18s, transform .18s;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
  }
  .dropzone-icon{
    color:var(--slate);
    transition:color .18s, transform .18s;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--yellow);
    background:linear-gradient(180deg, #FFFBEA 0%, #FFF3C4 100%);
  }
  .dropzone.drag{transform:scale(1.008);}
  .dropzone:hover .dropzone-icon, .dropzone.drag .dropzone-icon{
    color:#B8790A;
    transform:translateY(-2px);
  }
  .dropzone-title{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
  }
  .dropzone-sub{
    display:block;
    font-size:11.5px;
    color:var(--slate);
  }
  .thumbs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .thumb{
    position:relative;
    width:64px;height:64px;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb button{
    position:absolute;top:2px;right:2px;
    width:18px;height:18px;
    border-radius:50%;
    border:none;
    background:rgba(26,17,70,0.85);
    color:#fff;
    font-size:11px;
    line-height:1;
    cursor:pointer;
  }
  .status-banner{
    display:flex;
    gap:9px;
    align-items:flex-start;
    padding:11px 12px;
    border-radius:8px;
    font-size:12.5px;
    line-height:1.5;
    margin-top:2px;
  }
  .status-banner.ok{background:#EEF9F0;border:1px solid rgba(63,143,92,0.35);color:#2A6B41;}
  .status-banner.warn{background:#FFF6DE;border:1px solid rgba(184,121,10,0.35);color:#8A5E06;}
  .status-banner.err{background:#FDECEC;border:1px solid rgba(178,59,59,0.3);color:var(--danger);}
  .status-banner .icon{font-family:'JetBrains Mono',monospace;font-weight:700;flex-shrink:0;}
  .status-banner .sub{display:block;color:var(--slate);margin-top:4px;font-weight:400;}
  .status-banner b{font-weight:700;}
  .code-files{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .code-chip{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    background:#F0ECFB;
    border:1px solid var(--line);
    color:var(--navy-light);
    padding:4px 8px;
    border-radius:5px;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .code-chip.truncated{border-color:rgba(184,121,10,0.5);background:#FFF6DE;color:#8A5E06;}
  .code-chip button{
    border:none;background:none;cursor:pointer;
    color:inherit;opacity:0.6;font-size:12px;line-height:1;padding:0;
  }
  .code-chip button:hover{opacity:1;}
  .generate-btn{
    margin-top:auto;
    background:var(--yellow);
    color:var(--navy);
    border:none;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.04em;
    padding:14px;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .1s, box-shadow .15s;
  }
  .generate-btn:hover{box-shadow:0 4px 14px rgba(245,196,0,0.4);}
  .generate-btn:active{transform:scale(0.98);}
  .generate-btn:disabled{
    background:#E4DEF2;
    color:var(--slate);
    cursor:not-allowed;
    box-shadow:none;
  }
  .spinner{
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .spinner span{
    width:6px;height:6px;
    border-radius:50%;
    background:currentColor;
    animation:dotPulse 1.2s ease-in-out infinite;
  }
  .spinner span:nth-child(2){animation-delay:0.15s;}
  .spinner span:nth-child(3){animation-delay:0.3s;}
  .spinner.mini span{width:4.5px;height:4.5px;}
  @keyframes dotPulse{
    0%, 80%, 100%{transform:scale(0.55);opacity:0.35;}
    40%{transform:scale(1);opacity:1;}
  }
  .error-box{
    background:#FDECEC;
    border:1px solid rgba(178,59,59,0.3);
    color:var(--danger);
    font-size:12.5px;
    padding:10px 12px;
    border-radius:8px;
  }

  .output-panel{
    padding:32px 40px;
    overflow-y:auto;
    max-height:calc(100vh - 96px);
  }
  .output-empty{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--slate);
    text-align:center;
    gap:10px;
    padding:60px 20px;
  }
  .output-empty .glyph{
    font-family:'JetBrains Mono',monospace;
    font-size:34px;
    color:var(--line);
  }
  .output-empty h3{margin:0;color:var(--ink);font-size:16px;}
  .output-empty p{margin:0;font-size:13.5px;max-width:340px;line-height:1.5;}

  .output-toolbar{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-bottom:18px;
  }
  .output-toolbar button{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--navy);
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  .output-toolbar button:hover{border-color:var(--navy-light);}

  .doc h2, .doc h3{
    font-family:'JetBrains Mono',monospace;
    color:var(--navy);
    letter-spacing:.01em;
  }
  .doc h2{
    font-size:16px;
    margin:36px 0 14px;

// --- window.storage polyfill ---
// The rest of this file (unchanged from the Claude.ai artifact version) calls
// window.storage.get/set/delete/list exactly like Claude.ai's own artifact storage.
// This backs those same calls with a single Supabase table instead — every existing
// loadHistory()/saveHistory()/loadFeedbackLog()/etc. function works with zero changes.
window.storage = {
  async get(key, shared){
    const { data, error } = await supabaseClient.from('app_storage').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    if(!data) throw new Error('not found'); // matches Claude.ai's storage: missing key throws, not null
    return { key, value: data.value, shared: !!shared };
  },
  async set(key, value, shared){
    const { data: userData, error: userErr } = await supabaseClient.auth.getUser();
    if(userErr || !userData.user) throw new Error('Not signed in');
    const { error } = await supabaseClient.from('app_storage').upsert({
      user_id: userData.user.id, key, value, shared: !!shared, updated_at: new Date().toISOString()
    });
    if(error) throw error;
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    const { error } = await supabaseClient.from('app_storage').delete().eq('key', key);
    if(error) throw error;
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared){
    let query = supabaseClient.from('app_storage').select('key');
    if(prefix) query = query.like('key', `${prefix}%`);
    const { data, error } = await query;
    if(error) throw error;
    return { keys: (data || []).map(r => r.key), prefix, shared: !!shared };
  }
};

You are an expert Senior Product Manager and Technical Business Analyst. Your role is to analyze product mockups (provided as images/extracted visual data) and text inputs to generate, refine, or break down comprehensive Agile Epics and User Stories.

Based on the USER_INTENT, execute ONLY the corresponding instruction block below:

## 1. Strict Epic Schema

## 2. Strict Child Story Schema
Generate a collection of detailed user stories to cover all functionalities mentioned in the Epic. Use this exact structure for each story:

// window.storage.get() throws both when a key genuinely doesn't exist AND for other failures
// (transient errors, etc.) — there's no way to tell these apart from the error alone. Silently
// treating both as "nothing saved yet" is how a real failure turns into a real overwrite the next
// time something saves. This checks list() as a second signal before ever assuming it's safe.
async function safeLoadKey(key){
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      const result = await window.storage.get(key, false);
      return { ok: true, value: result ? result.value : null };
    }catch(err){
      if(attempt === 0){ await new Promise(r => setTimeout(r, 300)); continue; } // one retry for transient blips
      try{
        const listing = await window.storage.list(key, false);
        const exists = !!(listing && listing.keys && listing.keys.includes(key));
        if(exists) return { ok: false }; // data exists but couldn't be read — never safe to overwrite
        return { ok: true, value: null }; // genuinely never saved
      }catch(listErr){
        return { ok: false }; // can't verify either way — be conservative
      }
    }
  }
  return { ok: false };
}

async function extractWordText(file){
  if(typeof mammoth === 'undefined'){
    throw new Error('Word doc support failed to load (mammoth). Try re-uploading, or paste the text directly.');
  }
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer });
  return result.value.trim();
}

function wireWordUploadWidgets(){
  document.querySelectorAll('.word-upload-row').forEach(row => {
    const targetId = row.dataset.target;
    const btn = row.querySelector('.word-upload-btn');
    const input = row.querySelector('input[type=file]');
    const status = row.querySelector('.word-upload-status');
    if(!btn || !input) return;
    btn.onclick = () => input.click();
    input.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if(!files.length) return;
      status.textContent = `Reading ${files.length} file(s)…`;
      const textarea = document.getElementById(targetId);
      let addedCount = 0, failedNames = [];
      for(const file of files){
        try{
          const text = await extractWordText(file);
          if(textarea){
            const separator = textarea.value.trim() ? '\n\n' : '';
            textarea.value += `${separator}--- ${file.name} ---\n${text}`;
          }
          addedCount++;
        }catch(err){
          console.error(err);
          failedNames.push(file.name);
        }
      }
      status.textContent = failedNames.length
        ? `Added ${addedCount} file(s). Failed: ${failedNames.join(', ')}.`
        : `Added ${addedCount} file(s) to the text above.`;
      input.value = '';
    });
  });
}

  png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
  gif: 'image/gif', webp: 'image/webp'
};

// Files that describe the actual built product rather than build tooling/scratch scripts.
const NAMED_DOC_FILES = ['readme.md', 'epics.md', 'agents.md', 'metadata.json', 'index.html'];
const CODE_EXTS = ['tsx', 'ts', 'jsx', 'js', 'css'];
// Zips exported from iterative AI-coding workflows often contain backup/snapshot copies of the
// whole project (e.g. "extracted_zip/", "original_app/") alongside the real one — these get
// excluded outright rather than deduped, so we don't end up mixing an old snapshot's version of
// one file with the current version of another.
const BLOCKED_TOP_FOLDERS = ['extracted_zip', 'original_app', 'dist', 'build', '.git', 'node_modules'];
// Files at or under this size are sent to the main generation call as raw, complete source.
// Anything larger cannot fit in a single pass alongside everything else — rather than truncate
// it (which would silently drop whatever comes after the cut point), it gets read in full via
// sequential chunked passes and compressed into a complete functionality inventory instead.
const LARGE_FILE_THRESHOLD = 250000;
const CHUNK_SIZE = 45000;
const CHUNK_CONCURRENCY = 3;

function isRelevantCodeFile(path){
  const lower = path.toLowerCase();
  const segments = lower.split('/');
  if(segments.length > 1 && BLOCKED_TOP_FOLDERS.includes(segments[0])) return false;
  if(lower.includes('node_modules/') || lower.includes('.git/')) return false;
  const basename = segments[segments.length - 1];
  if(NAMED_DOC_FILES.includes(basename)) return true;
  const ext = basename.split('.').pop();
  if(segments.includes('src') && CODE_EXTS.includes(ext)) return true;
  return false;
}

function contentFingerprint(str){
  let hash = 0;
  const step = Math.max(1, Math.floor(str.length / 400));
  for(let i = 0; i < str.length; i += step){
    hash = (hash * 31 + str.charCodeAt(i)) | 0;
  }
  return str.length + ':' + hash;
}

function docPriority(basename){
  const order = ['epics.md', 'readme.md', 'agents.md', 'metadata.json', 'index.html'];
  const idx = order.indexOf(basename.toLowerCase());
  return idx === -1 ? 99 : idx;
}

async function saveMockToStorage(sourceName, force){
  if(!mockLoadOk && !force){
    setMockSaveNotice('Not saved — the existing product mock could not be verified on load, so saving is paused to avoid overwriting it. Reload the tool, or use Backup & Restore in History if you have a backup.', true);
    return;

  savedMockMeta = { savedAt: Date.now(), sourceName: sourceName || (savedMockMeta && savedMockMeta.sourceName) || null };
  try{
    const full = JSON.stringify({ images: uploadedImages, codeFiles: uploadedCodeFiles, meta: savedMockMeta });
    if(full.length <= 4500000){
      await window.storage.set('epic-forge-product-mock', full, false);
      mockLoadOk = true;
      setMockSaveNotice('');
      return;
    }
    // Over the storage limit with images included — try persisting code/docs only.
    const noImages = JSON.stringify({ images: [], codeFiles: uploadedCodeFiles, meta: savedMockMeta });
    if(noImages.length <= 4500000){
      await window.storage.set('epic-forge-product-mock', noImages, false);
      mockLoadOk = true;
      setMockSaveNotice('Saved for next time — screenshots were too large to persist alongside the source files, so only source/doc files were saved. Images still work for this session.', true);
      return;
    }
    setMockSaveNotice('This mock is too large to save as a persistent setting (over ~4.5MB). It will still work for this session — try trimming screenshots or splitting the export.', true);
  }catch(err){
    console.error(err);
    setMockSaveNotice('Could not save this as your default product mock (storage error). It will still work for this session.', true);
  }
}

// --- History: every generated document, stored locally, auto-expiring unless archived ---

const HISTORY_RETENTION_MS = 30 * 24 * 60 * 60 * 1000; // 30 days
const MAX_HISTORY_ENTRIES = 100;
const MAX_HISTORY_BYTES = 4500000;

async function loadLLMProvider(){
  try{
    const res = await safeLoadKey('epic-forge-llm-provider');
    if(res.ok && res.value){
      llmProvider = res.value === 'gemini' ? 'gemini' : 'anthropic';
    }
  }catch(err){
    // keep default 'anthropic' — this setting is low-stakes enough not to need the full
    // data-loss guard the mock/feedback/history keys use
  }
}

async function saveLLMProvider(value){
  llmProvider = value === 'gemini' ? 'gemini' : 'anthropic';
  try{
    await window.storage.set('epic-forge-llm-provider', llmProvider, false);
  }catch(err){
    console.error(err);
  }
}

async function loadHistory(){
  const res = await safeLoadKey('epic-forge-history');
  if(!res.ok){
    historyLoadOk = false;
    return;
  }
  historyLoadOk = true;
  if(res.value) historyLog = JSON.parse(res.value) || [];
  if(pruneExpiredHistory()) await saveHistory();
}

function pruneExpiredHistory(){
  const before = historyLog.length;
  const now = Date.now();
  historyLog = historyLog.filter(e => e.archived || (now - e.timestamp) < HISTORY_RETENTION_MS);
  return historyLog.length !== before;
}

function trimOldestNonArchived(){
  for(let i = historyLog.length - 1; i >= 0; i--){
    if(!historyLog[i].archived){ historyLog.splice(i, 1); return true; }
  }
  return false; // everything left is archived — nothing safe to drop automatically
}

async function saveHistory(force){
  if(!historyLoadOk && !force){
    console.warn('Skipping history save — initial load could not be verified, refusing to risk overwriting existing data.');
    return;
  }
  while(historyLog.length > MAX_HISTORY_ENTRIES){
    if(!trimOldestNonArchived()) break;
  }
  try{
    let payload = JSON.stringify(historyLog);
    while(payload.length > MAX_HISTORY_BYTES){
      if(!trimOldestNonArchived()) break;
      payload = JSON.stringify(historyLog);
    }
    await window.storage.set('epic-forge-history', payload, false);
    historyLoadOk = true;
  }catch(err){
    console.error(err);
  }
}

async function addHistoryEntry(entry){
  if(!historyLoadOk){
    setError('Not saved to History — the existing saved history could not be verified on load, so saving is paused to avoid overwriting it. Your output above is still visible; reload the tool or restore a backup before generating again.');
    return;
  }
  historyLog.unshift(entry);
  pruneExpiredHistory();
  await saveHistory();
}

async function toggleArchiveEntry(id){
  const entry = historyLog.find(e => e.id === id);
  if(!entry) return;
  entry.archived = !entry.archived;
  await saveHistory();

}

async function deleteHistoryEntry(id){
  historyLog = historyLog.filter(e => e.id !== id);

}

function truncateTitle(s){
  s = (s || '').trim();
  return s.length > 100 ? s.slice(0, 100) + '…' : s;
}

function extractHistoryTitle(raw){
  const lines = (raw || '').split('\n');
  for(let i = 0; i < lines.length; i++){
    const line = lines[i].trim();
    if(!line) continue;
    const heading = line.match(/^#{2,3}\s*(.*)$/);
    if(heading){
      const headingText = heading[1].replace(/\*\*/g, '').trim();
      if(/^story/i.test(headingText)) return truncateTitle(headingText);
      for(let j = i + 1; j < lines.length; j++){
        const next = lines[j].trim();
        if(next) return truncateTitle(next.replace(/\*\*/g, ''));
      }
      return truncateTitle(headingText);
    }
    return truncateTitle(line.replace(/\*\*/g, ''));
  }
  return '(untitled)';
}

// Splits any generated output into the actual pushable Jira item(s). A plain Epic (no "## "
// headings at all) becomes one Epic item. Generate Stories / Design Update output can contain
// several "## Story N: Title" sections — each becomes its own Story item. A "## Design Change
// Summary" section is always excluded — it's commentary for you, not content for Jira.
function parseOutputIntoJiraItems(raw){
  const lines = (raw || '').split('\n');
  const headingPositions = [];
  lines.forEach((line, i) => {
    const m = line.trim().match(/^##\s+(.*)$/);
    if(m) headingPositions.push({ index: i, title: m[1].replace(/\*\*/g, '').trim() });
  });

  if(headingPositions.length === 0){
    return [{ type: 'epic', title: extractHistoryTitle(raw), markdown: raw.trim() }];
  }

  const items = [];

  const preambleEnd = headingPositions[0].index;
  const preambleText = lines.slice(0, preambleEnd).join('\n').trim();
  if(preambleText){
    items.push({ type: 'epic', title: extractHistoryTitle(preambleText), markdown: preambleText });
  }

  for(let h = 0; h < headingPositions.length; h++){
    const start = headingPositions[h].index;
    const end = h + 1 < headingPositions.length ? headingPositions[h + 1].index : lines.length;
    const sectionTitle = headingPositions[h].title;
    if(/^design change summary$/i.test(sectionTitle)) continue; // commentary, not pushable content

    const sectionText = lines.slice(start, end).join('\n').trim();
    const sectionBodyOnly = lines.slice(start + 1, end).join('\n').trim(); // without this section's own "## " line
    const isStory = /^story/i.test(sectionTitle);
    items.push({
      type: isStory ? 'story' : 'epic',
      title: isStory ? (sectionTitle.replace(/^story\s*\d*:?\s*/i, '').trim() || sectionTitle) : extractHistoryTitle(sectionBodyOnly),
      markdown: sectionText,
    });
  }

  return items.length ? items : [{ type: 'epic', title: extractHistoryTitle(raw), markdown: raw.trim() }];
}

function daysRemaining(entry){
  if(entry.archived) return null;
  const msLeft = entry.timestamp + HISTORY_RETENTION_MS - Date.now();
  return Math.max(0, Math.ceil(msLeft / (24 * 60 * 60 * 1000)));
}

function getVersionInfo(entry){
  let count = 1;
  let current = entry;
  const visited = new Set();
  let brokenChain = false;
  while(current.parentId){
    if(visited.has(current.parentId)) break;
    visited.add(current.parentId);
    const parent = historyLog.find(e => e.id === current.parentId);
    if(!parent){ brokenChain = true; break; }
    count++;
    current = parent;
  }
  return { count, brokenChain };
}

function buildBackupJson(){
  return JSON.stringify({
    exportedAt: new Date().toISOString(),
    mock: { images: uploadedImages, codeFiles: uploadedCodeFiles, meta: savedMockMeta },
    feedback: feedbackLog,
    history: historyLog
  }, null, 2);
}

async function exportBackup(){
  const json = buildBackupJson();

  // No file-download attempt here at all — triggering an <a download> click is what was
  // breaking the page. This reveals the content directly and tries a clipboard copy instead,
  // both of which don't touch the browser's download/navigation machinery.
  const wrap = document.getElementById('backupFallbackWrap');
  const textarea = document.getElementById('backupTextFallback');
  if(wrap && textarea){
    textarea.value = json;
    wrap.style.display = 'block';
    textarea.focus();
    textarea.select();

}

function normalizeWordSmartPunctuation(text){
  return text
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u2013\u2014]/g, '-')
    .replace(/\u2026/g, '...')
    .replace(/\u00A0/g, ' ');
}

async function extractBackupTextFromFile(fileLike){
  const name = (fileLike.name || '').toLowerCase();
  const isDocx = name.endsWith('.docx') || fileLike.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  if(isDocx && typeof fileLike.arrayBuffer === 'function'){
    const raw = await extractWordText(fileLike);
    return { text: normalizeWordSmartPunctuation(raw), fromDocx: true };
  }
  return { text: await fileLike.text(), fromDocx: false };
}

let pendingBackupRestore = null; // {backup, summary, fromDocx} — awaiting explicit confirmation via in-page buttons

async function importBackup(file){
  const setStatus = (html) => {
    const el = document.getElementById('restoreStatus');
    if(el) el.innerHTML = html;
  };

  const looksLikeDocx = (file.name || '').toLowerCase().endsWith('.docx');
  setStatus(statusBanner('warn', 'progress', looksLikeDocx ? 'Reading Word document…' : 'Reading backup…', 'Checking the file before restoring anything.'));

  let text, fromDocx;
  try{
    const extracted = await extractBackupTextFromFile(file);
    text = extracted.text;
    fromDocx = extracted.fromDocx;
  }catch(err){
    setStatus(statusBanner('err', '⚠', 'Could not read that file', err.message || 'Try a plain .json file, or paste the text directly instead.'));
    return;
  }

  let backup;
  try{
    backup = JSON.parse(text);
  }catch(err){
    setStatus(statusBanner('err', '⚠', "That doesn't look like a valid backup",
      fromDocx
        ? "Extracted the text from that Word doc, but it isn't valid JSON. If you typed or pasted it directly into Word, its autocorrect may have altered punctuation beyond what could be fixed automatically — try pasting the text here instead."
        : 'The file is not valid JSON — nothing was changed.'));
    return;
  }
  const summary = [
    backup.mock ? `Product mock (${backup.mock.sourceName || (backup.mock.meta && backup.mock.meta.sourceName) || 'unnamed'})` : null,
    backup.feedback ? `${backup.feedback.length} feedback entr${backup.feedback.length === 1 ? 'y' : 'ies'}` : null,
    backup.history ? `${backup.history.length} history entr${backup.history.length === 1 ? 'y' : 'ies'}` : null
  ].filter(Boolean).join(', ');

  // This tool's sandbox blocks native browser dialogs (confirm/alert/prompt) outright — they
  // silently no-op rather than throwing, so a blocked confirm() would always return false and
  // abort every restore without explanation. This asks for confirmation in-page instead.
  pendingBackupRestore = { backup, summary, fromDocx };
  setStatus(`
    <div class="status-banner warn" style="align-items:flex-start;">
      <span class="icon">⚠</span>
      <span>
        <b>Restore this backup?</b>
        <span class="sub">${escapeHtml(summary || 'Nothing recognizable found in this file.')} — this replaces what's currently saved in this tool.</span>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button id="confirmRestoreBtn" style="font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;border:none;background:var(--yellow);color:var(--navy);padding:7px 13px;border-radius:6px;cursor:pointer;">Yes, restore</button>
          <button id="cancelRestoreBtn" style="font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--navy);padding:7px 13px;border-radius:6px;cursor:pointer;">Cancel</button>
        </div>
      </span>
    </div>
  `);
  document.getElementById('confirmRestoreBtn').onclick = applyPendingBackupRestore;
  document.getElementById('cancelRestoreBtn').onclick = () => {
    pendingBackupRestore = null;
    setStatus('');
  };
}

async function applyPendingBackupRestore(){
  if(!pendingBackupRestore) return;
  const { backup, summary, fromDocx } = pendingBackupRestore;
  pendingBackupRestore = null;

  const setStatus = (html) => {
    const el = document.getElementById('restoreStatus');
    if(el) el.innerHTML = html;
  };
  setStatus(statusBanner('warn', 'progress', 'Restoring…', 'Writing the backup back into this tool\'s storage.'));

  if(backup.mock){
    uploadedImages = backup.mock.images || [];
    uploadedCodeFiles = backup.mock.codeFiles || [];
    savedMockMeta = backup.mock.meta || null;
    await saveMockToStorage(undefined, true);
  }
  if(backup.feedback){
    feedbackLog = backup.feedback;
    await saveFeedbackLog(true);
  }
  if(backup.history){
    historyLog = backup.history;
    pruneExpiredHistory();
    await saveHistory(true);
  }

  restoreStatusHtml = statusBanner('ok', '✓', 'Restore complete', (summary ? `Restored: ${summary}.` : 'Finished, though the backup had nothing recognizable to restore.') + (fromDocx ? ' (read from the Word document)' : ''));
  renderApp();
}

async function handleFiles(fileList){
  const replaceToggle = document.getElementById('replaceToggle');
  if(replaceToggle && replaceToggle.checked){
    uploadedImages = [];
    uploadedCodeFiles = [];
  }
  const files = Array.from(fileList);
  let zipName = null;
  for(const file of files){
    const isZip = file.name.toLowerCase().endsWith('.zip') ||
                  file.type === 'application/zip' ||
                  file.type === 'application/x-zip-compressed';
    if(isZip){
      zipName = file.name;
      await handleZipFile(file);
    } else if(file.type.startsWith('image/')){
      setZipStatus(statusBanner('ok', '✓', `${file.name} added`, 'Loose image, ready to analyze.'));
      await handleImageFile(file);
    }
  }
  await saveMockToStorage(zipName);
  renderApp();
}

function handleImageFile(file){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      uploadedImages.push({ data: base64, mediaType: file.type, name: file.name });
      renderThumbs();
      resolve();
    };
    reader.readAsDataURL(file);
  });
}

// --- Deep-read pipeline for files too large for a single pass ---

function chunkText(text, chunkSize){
  const chunks = [];
  let start = 0;
  while(start < text.length){
    let end = Math.min(start + chunkSize, text.length);
    if(end < text.length){
      const lastNewline = text.lastIndexOf('\n', end);
      if(lastNewline > start + chunkSize * 0.5) end = lastNewline + 1;
    }
    chunks.push(text.slice(start, end));
    start = end;
  }
  return chunks;
}

async function mapWithConcurrency(items, limit, fn){
  const results = new Array(items.length);
  let next = 0;
  async function worker(){
    while(next < items.length){
      const i = next++;
      results[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

// --- Calls our Supabase Edge Function instead of Anthropic directly.
// The function holds the real API key server-side and verifies this Supabase session token
// before forwarding the request, so the key is never exposed to the browser. ---
async function callClaudeProxy(body){
  const { data: sessionData } = await supabaseClient.auth.getSession();
  const token = sessionData && sessionData.session ? sessionData.session.access_token : null;
  if(!token) throw new Error('Not signed in — please sign in again.');
  return fetch(`${SUPABASE_URL}/functions/v1/claude`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ ...body, provider: llmProvider })
  });
}

// --- Jira integration: search/create/update via the "jira" Edge Function ---

async function callJiraProxy(action, params){
  const { data: sessionData } = await supabaseClient.auth.getSession();
  const token = sessionData && sessionData.session ? sessionData.session.access_token : null;
  if(!token) throw new Error('Not signed in — please sign in again.');
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/jira`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({ action, ...params }),
  });
  let data;
  try{ data = await resp.json(); }catch(e){ data = {}; }
  if(!resp.ok || data.error){
    const msg = data.error && data.error.message ? data.error.message
      : typeof data.error === 'string' ? data.error
      : `Jira request failed (${resp.status}).`;
    throw new Error(msg);
  }
  return data;
}

  let debounceTimer = null;
  const runSearch = async () => {
    const q = inputEl.value.trim();
    resultsEl.innerHTML = '<div class="hint">Searching…</div>';
    try{
      const items = await searchFn(q);
      if(!items.length){ resultsEl.innerHTML = '<div class="hint">No matches.</div>'; return; }
      resultsEl.innerHTML = items.map((it, i) => `<div class="jira-result" data-i="${i}">${escapeHtml(it.key)} — ${escapeHtml(it.label)}</div>`).join('');
      resultsEl.querySelectorAll('.jira-result').forEach(el => {
        el.onclick = () => onSelect(items[Number(el.dataset.i)]);
      });
    }catch(err){
      resultsEl.innerHTML = `<div class="hint" style="color:var(--danger);">${escapeHtml(err.message)}</div>`;
    }
  };
  inputEl.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 350);
  });
  runSearch(); // show initial results (e.g. full project list) as soon as the field opens
}

  }

  render();

async function summarizeChunk(filePath, idx, total, chunkStr, attempt){
  try{
    const response = await callClaudeProxy({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: CHUNK_SUMMARY_SYSTEM,
      messages: [{ role: 'user', content: [{ type: 'text', text: `File: ${filePath}\nFragment ${idx + 1} of ${total}:\n\n${chunkStr}` }] }]
    });
    if(!response.ok) throw new Error(`API error ${response.status}`);
    const data = await response.json();
    return data.content.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  }catch(err){
    if(!attempt){
      return summarizeChunk(filePath, idx, total, chunkStr, 1);
    }
    return `[Analysis failed for this fragment — ${err.message || 'unknown error'}. Coverage of this section of the file is incomplete.]`;
  }
}

async function deepReadLargeFile(item, onProgress){
  const chunks = chunkText(item.content, CHUNK_SIZE);
  let done = 0;
  const summaries = await mapWithConcurrency(chunks, CHUNK_CONCURRENCY, async (chunk, i) => {
    const summary = await summarizeChunk(item.path, i, chunks.length, chunk);
    done++;
    onProgress(done, chunks.length);
    return { idx: i, summary };
  });
  const failed = summaries.filter(s => s.summary.startsWith('[Analysis failed')).length;
  const manifest = summaries.map(s => `### Fragment ${s.idx + 1}/${chunks.length}\n${s.summary}`).join('\n\n');
  return { manifest, chunkCount: chunks.length, failed };
}

async function handleZipFile(file){
  if(typeof JSZip === 'undefined'){
    setError('Zip support failed to load (JSZip). Try re-uploading, or extract the files and drop them in individually.');
    return;
  }
  setZipStatus(statusBanner('warn', 'progress', `Reading ${file.name}`, 'Unzipping and scanning contents.'));
  try{
    const zip = await JSZip.loadAsync(file);
    const entries = Object.values(zip.files).filter(f => !f.dir);

    let imagesAdded = 0;
    const seenFingerprints = new Map();
    const candidateDocs = [];
    const candidateSrc = [];
    let otherSkipped = 0;

    for(const entry of entries){
      const ext = entry.name.split('.').pop().toLowerCase();
      const mediaType = IMAGE_EXT_TO_MEDIA[ext];
      if(mediaType){
        const base64 = await entry.async('base64');
        const shortName = entry.name.split('/').pop();
        uploadedImages.push({ data: base64, mediaType, name: shortName });
        imagesAdded++;
        continue;
      }
      if(isRelevantCodeFile(entry.name)){
        const text = await entry.async('string');
        const fp = contentFingerprint(text);
        if(seenFingerprints.has(fp)){ otherSkipped++; continue; } // accidental exact duplicate
        seenFingerprints.set(fp, true);
        const basename = entry.name.split('/').pop();
        const item = { path: entry.name, basename, content: text, originalLength: text.length };
        if(NAMED_DOC_FILES.includes(basename.toLowerCase())) candidateDocs.push(item);
        else candidateSrc.push(item);
        continue;
      }
      otherSkipped++;
    }

    candidateDocs.sort((a, b) => docPriority(a.basename) - docPriority(b.basename));
    candidateSrc.sort((a, b) => a.originalLength - b.originalLength);
    const allCandidates = [...candidateDocs, ...candidateSrc];

    renderThumbs();

    // Pass 1: everything that fits goes in raw and immediately. Large files get a placeholder
    // while they're deep-read in the background, so the UI can show real progress.
    uploadedCodeFiles = allCandidates.map(item => {
      if(item.originalLength <= LARGE_FILE_THRESHOLD){
        return { path: item.path, content: item.content, originalLength: item.originalLength, mode: 'raw' };
      }
      return { path: item.path, content: '', originalLength: item.originalLength, mode: 'pending', chunkProgress: '0/?' };
    });
    renderCodeChips();

    const largeItems = allCandidates.filter(item => item.originalLength > LARGE_FILE_THRESHOLD);
    const includedCount = uploadedCodeFiles.length;

    if(imagesAdded === 0 && includedCount === 0){
      setZipStatus(statusBanner('warn', '⚠', `${file.name} uploaded, but nothing readable was found inside`,
        'No screenshots and no recognized app source (looked under /src, and for README.md / EPICS.md / AGENTS.md / metadata.json / index.html).'));
      return;
    }

    const baseTitle = imagesAdded > 0 && includedCount > 0
      ? `${file.name} uploaded — read as ${imagesAdded} screenshot(s) + ${includedCount} source/doc file(s)`
      : imagesAdded > 0
        ? `${file.name} uploaded — read as ${imagesAdded} screenshot(s)`
        : `${file.name} uploaded — read as source code (${includedCount} file(s))`;

    if(largeItems.length === 0){
      const subParts = [];
      if(otherSkipped > 0) subParts.push(`${otherSkipped} other file(s) skipped (build/debug scripts, configs, backup snapshot folders)`);
      setZipStatus(statusBanner('ok', '✓', baseTitle, subParts.join(' · ')));
      return;
    }

    // Deep-read large files one at a time, with live per-file progress in the banner.
    setZipStatus(statusBanner('warn', 'progress', baseTitle,
      `${largeItems.length} file(s) too large for a single pass — deep-reading in full via chunked analysis, nothing will be skipped.`));

    for(const item of largeItems){
      const target = uploadedCodeFiles.find(f => f.path === item.path);
      const { manifest, chunkCount, failed } = await deepReadLargeFile(item, (done, total) => {
        target.chunkProgress = `${done}/${total}`;
        setZipStatus(statusBanner('warn', 'progress', baseTitle,
          `Deep-reading ${item.path} — fragment ${done}/${total} analyzed (full file, nothing skipped)…`));
        renderCodeChips();
      });
      target.content = manifest;
      target.mode = 'manifest';
      target.chunkCount = chunkCount;
      target.failedChunks = failed;
      renderCodeChips();
    }

    const failedTotal = uploadedCodeFiles.reduce((sum, f) => sum + (f.failedChunks || 0), 0);
    const subParts = [];
    subParts.push(`${largeItems.length} large file(s) fully read via chunked analysis (${largeItems.map(i => i.path.split('/').pop()).join(', ')})`);
    if(failedTotal > 0) subParts.push(`⚠ ${failedTotal} fragment(s) failed after retry — coverage may be incomplete there`);
    if(otherSkipped > 0) subParts.push(`${otherSkipped} other file(s) skipped (build/debug scripts, configs, backup snapshot folders)`);
    setZipStatus(statusBanner(failedTotal > 0 ? 'warn' : 'ok', '✓', `${baseTitle} — deep read complete`, subParts.join(' · ')));
  }catch(err){
    console.error(err);
    setZipStatus('');
    setError(`Could not read ${file.name} as a zip: ${err.message || 'unknown error'}.`);
  }
}

function renderCodeChips(){
  const wrap = document.getElementById('codeFiles');
  if(!wrap) return;
  wrap.innerHTML = '';
  uploadedCodeFiles.forEach((f, i) => {
    const chip = document.createElement('div');
    let label, cls = '';
    if(f.mode === 'raw'){
      label = f.path;
    } else if(f.mode === 'pending'){
      label = `${f.path} — queued for deep read…`;
      cls = ' truncated';
    } else if(f.mode === 'reading'){
      label = `${f.path} — reading ${f.chunkProgress}…`;
      cls = ' truncated';
    } else {
      label = `${f.path} — fully read (${f.chunkCount} fragments)${f.failedChunks ? `, ${f.failedChunks} failed` : ''}`;
      cls = f.failedChunks ? ' truncated' : '';
    }
    chip.className = 'code-chip' + cls;
    chip.title = `${f.originalLength.toLocaleString()} characters`;
    chip.innerHTML = `<span>${label}</span><button title="Remove">&times;</button>`;
    chip.querySelector('button').onclick = () => { uploadedCodeFiles.splice(i, 1); renderCodeChips(); saveMockToStorage(); };
    wrap.appendChild(chip);
  });
}

function renderThumbs(){
  const thumbs = document.getElementById('thumbs');
  if(!thumbs) return;
  thumbs.innerHTML = '';
  uploadedImages.forEach((img, i) => {
    const el = document.createElement('div');
    el.className = 'thumb';
    el.innerHTML = `<img src="data:${img.mediaType};base64,${img.data}" alt="${img.name}"><button title="Remove">&times;</button>`;
    el.querySelector('button').onclick = () => { uploadedImages.splice(i,1); renderThumbs(); saveMockToStorage(); };
    thumbs.appendChild(el);
  });
}

async function handleGenerate(immediateFeedbackNote){
  setError('');
  const cfg = modeConfig[currentMode];
  const epicTextEl = document.getElementById('epicText');
  const epicText = epicTextEl ? epicTextEl.value.trim() : '';
  const storiesTextEl = document.getElementById('storiesText');
  const storiesText = storiesTextEl ? storiesTextEl.value.trim() : '';
  const extraNotes = document.getElementById('extraNotes').value.trim();
  const hasMock = uploadedImages.length > 0 || uploadedCodeFiles.length > 0;
  const stillReading = uploadedCodeFiles.some(f => f.mode === 'pending' || f.mode === 'reading');

  if(cfg.splitEpicStories){
    if(!epicText && !storiesText){
      setError('Add the current Epic and/or Stories text before generating (paste, or upload a Word doc).');
      return;
    }
  } else if(cfg.needsEpic && !epicText){
    setError('Add the Epic text before generating.');
    return;
  }
  if(currentMode === 'CREATE_EPIC_FROM_SCRATCH' && !hasMock){
    setError('Upload a mockup (screenshots or a product .zip) to create an Epic from scratch.');
    return;
  }
  if(cfg.needsFlowImages && flowImages.length === 0){
    setError('Upload at least one updated design screenshot (PNG/Figma export) for this mode.');
    return;
  }
  if(stillReading){
    setError('Still deep-reading a large mockup file — wait for the read to finish so nothing gets left out, then generate.');
    return;
  }

  setLoading(true);
  try{
    const result = await callClaude({
      intent: currentMode, epicText, storiesText, extraNotes,
      images: uploadedImages, codeFiles: uploadedCodeFiles, flowImages,
      immediateFeedbackNote
    });
    lastOutput = result.text;
    lastTruncated = result.truncated;
    renderOutput(result.text, result.truncated);

    const mockSummary = hasMock
      ? `${savedMockMeta && savedMockMeta.sourceName ? savedMockMeta.sourceName : 'Mock loaded'} — ${uploadedImages.length} image(s), ${uploadedCodeFiles.length} source/doc file(s)`
      : null;
    const flowImagesSummary = flowImages.length
      ? `${flowImages.length} flow image(s): ${flowImages.map(f => f.name).join(', ')}`
      : null;
    const newEntry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      timestamp: Date.now(),
      mode: currentMode,
      output: result.text,
      truncated: result.truncated,
      archived: false,
      parentId: currentHistoryEntryId || null,
      input: {
        epicText: epicText || null,
        storiesText: storiesText || null,
        extraNotes: extraNotes || null,
        mockSummary,
        flowImagesSummary,
        appliedFeedback: immediateFeedbackNote || null
      }
    };
    await addHistoryEntry(newEntry);
    currentHistoryEntryId = newEntry.id;
    renderChainNotice();
  }catch(err){
    console.error(err);
    setError('Generation failed: ' + (err.message || 'unknown error') + '. Check your network settings if this persists.');
  }finally{
    setLoading(false);
  }
}

async function callClaude({ intent, epicText, storiesText, extraNotes, images, codeFiles, flowImages, immediateFeedbackNote }){
  const contentBlocks = [];
  images.forEach(img => {
    contentBlocks.push({ type: 'image', source: { type: 'base64', media_type: img.mediaType, data: img.data } });
  });
  (flowImages || []).forEach(img => {
    contentBlocks.push({ type: 'image', source: { type: 'base64', media_type: img.mediaType, data: img.data } });
  });

  const realCodeFiles = (codeFiles || []).filter(f => f.mode === 'raw' || f.mode === 'manifest');

  let userText = `USER_INTENT: [${intent}]\n\n`;
  if(epicText){
    userText += `CURRENT_EPIC_TEXT:\n"""\n${epicText}\n"""\n\n`;
  }
  if(storiesText){
    userText += `CURRENT_STORIES_TEXT (Child Stories already written, kept separate from the Epic above — either or both may be present):\n"""\n${storiesText}\n"""\n\n`;
  }
  if(images.length){
    userText += `PRODUCT_MOCK_DATA (visual): ${images.length} mockup image(s) attached above.\n\n`;
  }
  if(flowImages && flowImages.length){
    if(intent === 'RECONCILE_DESIGN_CHANGES'){
      userText += `UPDATED DESIGN SCREENSHOTS (Figma/PNG): ${flowImages.length} image(s) attached above. These show the current state of the design AFTER review/implementation changes. Compare them meticulously against ${epicText && storiesText ? 'CURRENT_EPIC_TEXT and CURRENT_STORIES_TEXT' : storiesText ? 'CURRENT_STORIES_TEXT' : 'CURRENT_EPIC_TEXT'} above to find every UI/UX element, field, flow, label, or behavior that was added, changed, or removed since that text was written.\n\n`;
    } else {
      userText += `SUPPLEMENTARY FLOW IMAGES: ${flowImages.length} additional screenshot(s) attached above (separate from the product mock), showing a specific flow or behavior mentioned in the Epic text or guidance below. Use these to clarify or verify that exact flow — they don't replace the product mock as the source of truth for the rest of the product.\n\n`;
    }
  }
  if(realCodeFiles.length){
    userText += `PRODUCT_MOCK_DATA (source code export of the actual built product — this is ground truth for what exists today):\n\n`;
    realCodeFiles.forEach(f => {
      if(f.mode === 'raw'){
        userText += `--- FILE: ${f.path} (complete, ${f.originalLength} characters) ---\n${f.content}\n--- END FILE ---\n\n`;
      } else {
        userText += `--- FILE: ${f.path} (${f.originalLength.toLocaleString()} characters — too large for a single pass. The file was read in full across ${f.chunkCount} sequential fragments; below is the complete functionality inventory derived from that full read, not a truncated excerpt. Treat it with the same authority as raw source.${f.failedChunks ? ` Note: ${f.failedChunks} fragment(s) failed analysis after retry — coverage of those sections may be incomplete.` : ''}) ---\n${f.content}\n--- END FILE ---\n\n`;
      }
    });
  }
  if(extraNotes){
    userText += `Additional guidance from the PM: ${extraNotes}\n\n`;
  }
  if(immediateFeedbackNote){
    userText += `The PM just reviewed the immediately preceding output from this exact tool and left this specific note — apply it to this revision, and only to this revision, ahead of any general historical feedback below: "${immediateFeedbackNote}"\n\n`;
  }
  userText += `Proceed strictly according to the operational mode for this USER_INTENT and output only the schema content.`;

  contentBlocks.push({ type: 'text', text: userText });

  const response = await callClaudeProxy({
    model: 'claude-sonnet-4-6',
    max_tokens: 8192,
    system: SYSTEM_PROMPT + buildFeedbackContext(),
    messages: [{ role: 'user', content: contentBlocks }]
  });

  if(!response.ok){
    const errText = await response.text();
    throw new Error(`API error ${response.status}: ${errText.slice(0,200)}`);
  }

  const data = await response.json();
  const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('\n');
  return { text, truncated: data.stop_reason === 'max_tokens' };
}

// ---- Rendering: markdown-ish schema -> doc with BDD ledger styling ----

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function inlineFormat(line){
  let escaped = escapeHtml(line);
  escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return escaped;
}

const BDD_KEYWORDS = ['Given','When','Then','And'];

function bddRowInfo(line){
  const m = line.match(/^\s*\*\*(Given|When|Then|And)\*\*\s*(.*)$/);
  if(!m) return null;
  return { kw: m[1], rest: m[2] };
}

// --- Word export: same content as the schema output, rendered as Word-compatible HTML ---

function wordInline(line){
  return escapeHtml(line).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function rawToWordHtml(raw){
  const lines = raw.split('\n');
  let html = '';
  let inList = false;
  const closeList = () => { if(inList){ html += '</ul>'; inList = false; } };
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    const trimmed = line.trim();
    if(trimmed === ''){ i++; continue; }

    const h2 = trimmed.match(/^##\s+(.*)$/);
    if(h2){
      closeList();
      html += `<h2 style="font-size:15pt;color:#1A1146;border-bottom:1pt solid #1A1146;padding-bottom:4pt;margin:22pt 0 10pt;">${wordInline(h2[1])}</h2>`;
      i++; continue;
    }
    const h3 = trimmed.match(/^###\s+(.*)$/);
    if(h3){
      closeList();
      html += `<h3 style="font-size:10.5pt;letter-spacing:1pt;color:#6E668A;text-transform:uppercase;margin:14pt 0 6pt;">${wordInline(h3[1])}</h3>`;
      i++; continue;
    }

    const bullet = line.match(/^\s*-\s+(.*)$/);
    if(bullet){
      const content = bullet[1];
      const bdd = bddRowInfo(content);
      if(bdd){
        closeList();
        html += `<p style="margin:2pt 0 2pt 18pt;font-size:10.5pt;"><b>${bdd.kw}</b> ${wordInline(bdd.rest)}</p>`;
        i++;
        while(i < lines.length){
          const nextTrim = lines[i].trim();
          const nextBdd = bddRowInfo(nextTrim);
          if(nextBdd && !/^\s*-\s+/.test(lines[i])){
            html += `<p style="margin:2pt 0 2pt 18pt;font-size:10.5pt;"><b>${nextBdd.kw}</b> ${wordInline(nextBdd.rest)}</p>`;
            i++;
          } else break;
        }
        continue;
      }
      if(!inList){ html += '<ul style="margin:0 0 10pt 0;">'; inList = true; }
      html += `<li style="margin-bottom:4pt;font-size:11pt;">${wordInline(content)}</li>`;
      i++;
      continue;
    }

    const bareBdd = bddRowInfo(trimmed);
    if(bareBdd){
      closeList();
      html += `<p style="margin:2pt 0 2pt 18pt;font-size:10.5pt;"><b>${bareBdd.kw}</b> ${wordInline(bareBdd.rest)}</p>`;
      i++; continue;
    }

    closeList();
    html += `<p style="margin:0 0 10pt 0;font-size:11pt;">${wordInline(trimmed)}</p>`;
    i++;
  }
  closeList();
  return html;
}

// --- Rich-text copy: real bold + real numbered/bulleted lists, no visible **/### markup.
// Jira (and Word, Docs, Slack, Outlook) paste this as actual formatting rather than literal text. ---

// --- Clipboard with fallbacks. The artifact sandbox can block navigator.clipboard.write/writeText
// outright (permissions policy on the iframe, not something requestable at runtime), so every
// copy action falls through older mechanisms rather than failing outright. ---

async function tryModernRichCopy(html, plain){
  if(!window.ClipboardItem || !navigator.clipboard || !navigator.clipboard.write) return false;
  try{
    const item = new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([plain], { type: 'text/plain' })
    });
    await navigator.clipboard.write([item]);
    return true;
  }catch(err){ return false; }
}

function tryLegacyRichCopy(html){
  try{
    const container = document.createElement('div');
    container.contentEditable = 'true';
    container.style.position = 'fixed';
    container.style.left = '-9999px';
    container.style.top = '0';
    container.innerHTML = html;
    document.body.appendChild(container);
    const range = document.createRange();
    range.selectNodeContents(container);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    const ok = document.execCommand('copy');
    sel.removeAllRanges();
    document.body.removeChild(container);
    return ok;
  }catch(err){ return false; }
}

async function tryModernPlainCopy(plain){
  if(!navigator.clipboard || !navigator.clipboard.writeText) return false;
  try{ await navigator.clipboard.writeText(plain); return true; }catch(err){ return false; }
}

function tryLegacyPlainCopy(plain){
  try{
    const ta = document.createElement('textarea');
    ta.value = plain;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(err){ return false; }
}

// html is optional — pass null/'' to only ever attempt plain-text copy.
async function copyWithFallback(plain, html, btn){
  let ok = false, method = null;
  if(html){
    ok = await tryModernRichCopy(html, plain);
    if(ok) method = 'rich';
    if(!ok){ ok = tryLegacyRichCopy(html); if(ok) method = 'rich'; }
  }
  if(!ok){ ok = await tryModernPlainCopy(plain); if(ok) method = 'plain'; }
  if(!ok){ ok = tryLegacyPlainCopy(plain); if(ok) method = 'plain'; }

  if(btn){
    const old = btn.textContent;
    if(ok){
      btn.textContent = method === 'rich' ? 'Copied!' : 'Copied (plain text)';
      setTimeout(() => btn.textContent = old, 1400);
    } else {
      btn.textContent = 'Copy blocked — select & Ctrl/Cmd+C';
      setTimeout(() => btn.textContent = old, 2400);
    }
  }
  return ok;
}

function jiraInline(line){
  return escapeHtml(line).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function buildJiraHtml(raw){
  const lines = raw.split('\n');
  let html = '';
  let inUl = false, inOl = false;
  const closeLists = () => {
    if(inUl){ html += '</ul>'; inUl = false; }
    if(inOl){ html += '</ol>'; inOl = false; }
  };
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    const trimmed = line.trim();
    if(trimmed === ''){ i++; continue; }

    const h2 = trimmed.match(/^##\s+(.*)$/);
    if(h2){ closeLists(); html += `<h2>${jiraInline(h2[1])}</h2>`; i++; continue; }
    const h3 = trimmed.match(/^###\s+(.*)$/);
    if(h3){ closeLists(); html += `<h3>${jiraInline(h3[1])}</h3>`; i++; continue; }

    const bullet = line.match(/^\s*-\s+(.*)$/);
    if(bullet){
      const content = bullet[1];
      const bdd = bddRowInfo(content);
      if(bdd){
        if(inUl){ html += '</ul>'; inUl = false; }
        if(!inOl){ html += '<ol>'; inOl = true; }
        const rows = [`<b>${bdd.kw}</b> ${jiraInline(bdd.rest)}`];
        i++;
        while(i < lines.length){
          const nextTrim = lines[i].trim();
          const nextBdd = bddRowInfo(nextTrim);
          if(nextBdd && !/^\s*-\s+/.test(lines[i])){
            rows.push(`<b>${nextBdd.kw}</b> ${jiraInline(nextBdd.rest)}`);
            i++;
          } else break;
        }
        html += `<li>${rows.join('<br>')}</li>`;
        continue;
      }
      if(inOl){ html += '</ol>'; inOl = false; }
      if(!inUl){ html += '<ul>'; inUl = true; }
      html += `<li>${jiraInline(content)}</li>`;
      i++;
      continue;
    }

    const bareBdd = bddRowInfo(trimmed);
    if(bareBdd){
      if(inUl){ html += '</ul>'; inUl = false; }
      if(!inOl){ html += '<ol>'; inOl = true; }
      html += `<li><b>${bareBdd.kw}</b> ${jiraInline(bareBdd.rest)}</li>`;
      i++; continue;
    }

    closeLists();
    html += `<p>${jiraInline(trimmed)}</p>`;
    i++;
  }
  closeLists();
  return html;
}

function plainFallback(raw){
  return raw
    .replace(/^#{2,3}\s+/gm, '')
    .replace(/\*\*(.+?)\*\*/g, '$1');
}

function extractSection(raw, sectionName){
  const lines = raw.split('\n');
  let start = -1, end = lines.length;
  for(let i = 0; i < lines.length; i++){
    const m = lines[i].trim().match(/^#{2,3}\s+(.*)$/);
    if(m && m[1].trim().toLowerCase() === sectionName.toLowerCase()){ start = i; continue; }
    if(start !== -1 && i > start && m){ end = i; break; }
  }
  if(start === -1) return '';
  return lines.slice(start + 1, end).join('\n').trim();
}

async function copyRichText(raw, btn){
  const html = `<div>${buildJiraHtml(raw)}</div>`;
  const plain = plainFallback(raw);
  await copyWithFallback(plain, html, btn);
}

async function submitFeedback(regenerate){
  const noteEl = document.getElementById('feedbackNote');
  const note = noteEl ? noteEl.value.trim() : '';
  const notice = document.getElementById('feedbackSavedNotice');

  if(!currentRating && !note){
    if(notice){ notice.style.color = 'var(--danger)'; notice.textContent = 'Give a thumbs up/down or add a note first.'; }
    return;
  }

  const entry = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    timestamp: Date.now(),
    mode: currentMode,
    rating: currentRating,
    note,
    snippet: (lastOutput || '').replace(/[#*]/g, '').trim().slice(0, 120),
    historyEntryId: currentHistoryEntryId // ties this feedback to exactly the output just shown — nothing else
  };
  feedbackLog.unshift(entry);
  if(feedbackLog.length > MAX_FEEDBACK_ENTRIES) feedbackLog = feedbackLog.slice(0, MAX_FEEDBACK_ENTRIES);
  await saveFeedbackLog();

  if(regenerate){
    if(notice){ notice.style.color = 'var(--slate)'; notice.textContent = 'Saved — regenerating now with this feedback applied.'; }
    await handleGenerate(note || undefined);
  } else if(notice){
    notice.style.color = 'var(--given)';
    notice.textContent = 'Saved. Future Epics and Stories from this tool will take this into account.';
  }
}

function buildDocFragment(raw){
  const frag = document.createDocumentFragment();
  const lines = raw.split('\n');

  let i = 0;
  let currentList = null;
  let ledgerGroups = []; // array of arrays — each inner array is ONE criterion's Given/When/Then/And rows
  let storyWrapper = null; // wraps "## Story X" sections in a card

  function flushList(){
    if(currentList){ (storyWrapper||frag).appendChild(currentList); currentList = null; }
  }
  function flushLedger(){
    if(ledgerGroups.length){
      const ol = document.createElement('ol');
      ol.className = 'ac-list';
      ledgerGroups.forEach(group => {
        const li = document.createElement('li');
        li.innerHTML = group.map(row => `<strong>${row.kw}</strong> ${inlineFormat(row.rest)}`).join('<br>');
        ol.appendChild(li);
      });
      (storyWrapper||frag).appendChild(ol);
      ledgerGroups = [];
    }
  }

  while(i < lines.length){
    const line = lines[i];
    const trimmed = line.trim();

    if(trimmed === ''){ i++; continue; }

    // Story heading -> new card wrapper
    const storyMatch = trimmed.match(/^##\s+(.*)$/);
    if(storyMatch){
      flushList(); flushLedger();
      if(storyWrapper) frag.appendChild(storyWrapper);
      storyWrapper = document.createElement('div');
      storyWrapper.className = 'story-block';
      const h = document.createElement('h2');
      h.innerHTML = inlineFormat(storyMatch[1]);
      storyWrapper.appendChild(h);
      i++; continue;
    }

    const h3Match = trimmed.match(/^###\s+(.*)$/);
    if(h3Match){
      flushList(); flushLedger();
      const headingText = h3Match[1].trim();
      const JIRA_COPYABLE_SECTIONS = ['acceptance criteria', 'edge cases', 'testing guidelines'];
      if(JIRA_COPYABLE_SECTIONS.includes(headingText.toLowerCase())){
        const headRow = document.createElement('div');
        headRow.className = 'section-head';
        const h = document.createElement('h3');
        h.innerHTML = inlineFormat(h3Match[1]);
        h.style.margin = '0';
        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'section-copy-btn';
        copyBtn.textContent = 'Copy for Jira';
        copyBtn.onclick = () => copyRichText(extractSection(raw, headingText), copyBtn);
        headRow.appendChild(h);
        headRow.appendChild(copyBtn);
        (storyWrapper||frag).appendChild(headRow);
      } else {
        const h = document.createElement('h3');
        h.innerHTML = inlineFormat(h3Match[1]);
        (storyWrapper||frag).appendChild(h);
      }
      i++; continue;
    }

    // Bullet line
    const bulletMatch = line.match(/^\s*-\s+(.*)$/);
    if(bulletMatch){
      const content = bulletMatch[1];
      const bdd = bddRowInfo(content);
      if(bdd){
        flushList();
        ledgerGroups.push([bdd]);
        i++;
        // consume continuation lines (indented, no leading "- ") that are also BDD rows
        while(i < lines.length){
          const next = lines[i];
          const nextTrim = next.trim();
          const nextBdd = bddRowInfo(nextTrim);
          if(nextBdd && !/^\s*-\s+/.test(next)){
            ledgerGroups[ledgerGroups.length - 1].push(nextBdd);
            i++;
          } else break;
        }
        continue;
      }

      // Edge case / resolution styling
      const edgeMatch = content.match(/^\*\*(Edge Case:|Resolution:|Added:|Changed:|Removed:)\*\*\s*(.*)$/);
      if(edgeMatch){
        flushList(); flushLedger();
        let box = (storyWrapper||frag).lastElementChild;
        if(!box || !box.classList || !box.classList.contains('edge-case-pending')){
          box = document.createElement('div');
          box.className = 'edge-case edge-case-pending';
          (storyWrapper||frag).appendChild(box);
        }
        const p = document.createElement('div');
        p.innerHTML = `<strong>${edgeMatch[1]}</strong> ${inlineFormat(edgeMatch[2])}`;
        box.appendChild(p);
        box.classList.remove('edge-case-pending');
        i++;
        continue;
      }

      flushLedger();
      if(!currentList){ currentList = document.createElement('ul'); }
      const li = document.createElement('li');
      li.innerHTML = inlineFormat(content);
      currentList.appendChild(li);
      i++;
      continue;
    }

    // Plain BDD continuation line without bullet (rare formatting variance)
    const bareBdd = bddRowInfo(trimmed);
    if(bareBdd){
      flushList();
      if(ledgerGroups.length){
        ledgerGroups[ledgerGroups.length - 1].push(bareBdd);
      } else {
        ledgerGroups.push([bareBdd]);
      }
      i++;
      continue;
    }

    // Plain paragraph
    flushList(); flushLedger();
    const p = document.createElement('p');
    p.innerHTML = inlineFormat(trimmed);
    (storyWrapper||frag).appendChild(p);
    i++;
  }

  flushList(); flushLedger();
  if(storyWrapper) frag.appendChild(storyWrapper);

  return frag;
}
